syntax = "proto3";

package breeze.engine;

enum ParcelStatus {
  STATUS_UNKNOWN = 0;
  STATUS_QUEUED = 1;
  STATUS_ADMITTED = 2;
  STATUS_RUNNING = 3;
  STATUS_COMPLETED = 4;
  STATUS_FAILED = 5;
  STATUS_REJECTED = 6;
}

message TaskSpecProto {
  string task_type = 1;
  map<string, string> params = 2;
}

message JobParcelProto {
  string parcel_id = 1;
  repeated TaskSpecProto tasks = 2;
  string script_text = 3;
  string voice_name = 4;
  string instruction = 5;
  float cfg_scale = 6;
  float temperature = 7;
  int64 seed = 8;
  bytes audio_input = 9;
  map<string, string> upload_targets = 10;
  repeated string return_artifacts = 11;
  map<string, string> metadata = 12;
}

message AdmissionResponseProto {
  string parcel_id = 1;
  bool accepted = 2;
  string reason = 3;
  float estimated_duration_s = 4;
  float eta_s = 5;
  int32 queue_position = 6;
}

message ParcelProgressProto {
  string parcel_id = 1;
  ParcelStatus status = 2;
  string active_stage = 3;
  float progress = 4;
  string message = 5;
  float elapsed_seconds = 6;
}

message TelemetryFrameProto {
  string node_id = 1;
  uint64 timestamp_ms = 2;
  float cpu_percent = 3;
  float ram_used_gb = 4;
  float ram_total_gb = 5;

  // GPU Island 0 (CUDA 0)
  uint32 gpu0_vram_used_mb = 6;
  uint32 gpu0_vram_total_mb = 7;
  uint32 gpu0_util_percent = 8;
  int32 gpu0_active_tokens = 9;
  int32 gpu0_token_ceiling = 10;

  // GPU Island 1 (CUDA 1)
  uint32 gpu1_vram_used_mb = 11;
  uint32 gpu1_vram_total_mb = 12;
  uint32 gpu1_util_percent = 13;
  int32 gpu1_active_tokens = 14;
  int32 gpu1_token_ceiling = 15;

  int32 queue_length = 16;
  repeated ParcelProgressProto active_parcels = 17;
}

message JobResultProto {
  string parcel_id = 1;
  bool success = 2;
  string error_message = 3;
  float duration_s = 4;
  int32 sample_rate = 5;
  string transcript = 6;
  string subtitles_srt = 7;
  map<string, bool> upload_results = 8;
  map<string, bytes> artifact_bytes = 9;
  map<string, float> stage_timings = 10;
}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bz-ggml"
version = "1.0.0"
description = "High-throughput distributed speech inference engine for Breeze-TTS-2 powered by GGML."
authors = [{ name = "Sharjeel Ahmed", email = "sharjeelarain0308@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "psutil>=5.9.0",
    "websockets>=12.0",
    "protobuf>=4.25.0",
    "hjson>=3.1.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
gpu = [
    "faster-whisper>=1.0.0",
    "resemble-enhance>=0.0.1",
    "deepspeed>=0.12.0"
]
ui = [
    "gradio>=5.0.0"
]
all = [
    "faster-whisper>=1.0.0",
    "resemble-enhance>=0.0.1",
    "deepspeed>=0.12.0",
    "gradio>=5.0.0"
]

[tool.setuptools.packages.find]
where = ["python"]
